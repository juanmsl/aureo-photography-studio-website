    <!-- Initial loader: visible before the JS loads; src/splash.ts fades it out -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-content: center;
        justify-items: center;
        background: #120f0d;
        transition: opacity 600ms ease-out, visibility 0s linear 600ms;
      }
      #splash.is-done {
        opacity: 0;
        visibility: hidden;
      }
      /* The Áureo symbol: the light inside the doorway breathes, the lines stay */
      #splash .splash-logo {
        width: 72px;
        height: auto;
        overflow: visible;
      }
      #splash .splash-door {
        fill: #e8a75b;
        fill-opacity: 0.2;
        filter: drop-shadow(0 0 14px rgba(232, 167, 91, 0.45));
        animation: splash-door 2s ease-in-out infinite;
      }
      #splash .splash-lines {
        fill: #e8a75b;
        stroke: #e8a75b;
        stroke-width: 4;
        stroke-linejoin: round;
      }
      #splash .splash-pool {
        width: 160px;
        height: 18px;
        margin-top: 6px;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgba(232, 167, 91, 0.35), rgba(232, 167, 91, 0));
        animation: splash-light 2s ease-in-out infinite;
      }
      @keyframes splash-door {
        0%,
        100% {
          fill-opacity: 0.12;
        }
        50% {
          fill-opacity: 0.35;
        }
      }
      @keyframes splash-light {
        0%,
        100% {
          opacity: 0.35;
        }
        50% {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .splash-door,
        #splash .splash-pool {
          animation: none;
          opacity: 1;
        }
      }
    </style>
  </head>
