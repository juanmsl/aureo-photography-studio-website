<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#120F0D" />

    <!-- Installed app on iOS (the manifest covers Android and desktop) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Áureo" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta
      name="description"
      content="Áureo Estudio Fotográfico. Lo extraordinario, más allá de lo evidente. Naturaleza, paisaje, retrato, moda, arquitectura, interiores, eventos y producto."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://aureostudio.co/" />

    <!-- Link preview when sharing (Open Graph and X/Twitter) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Áureo Estudio Fotográfico" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:url" content="https://aureostudio.co/" />
    <meta property="og:title" content="Áureo · Estudio Fotográfico" />
    <meta property="og:description" content="Lo extraordinario, más allá de lo evidente." />
    <meta property="og:image" content="https://aureostudio.co/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Puerta entreabierta con luz dorada y el eslogan de Áureo" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta name="twitter:card" content="summary_large_image" />

    <title>Áureo · Estudio Fotográfico</title>

    <!-- Initial loader: visible before the JS loads; src/splash.ts fades it out -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-content: center;
        justify-items: center;
        background: #120f0d;
        transition: opacity 600ms ease-out, visibility 0s linear 600ms;
      }
      #splash.is-done {
        opacity: 0;
        visibility: hidden;
      }
      /* A slit of light, like a door left ajar, and the glow it casts on the floor */
      #splash .splash-slit {
        width: 2px;
        height: 96px;
        border-radius: 1px;
        background: linear-gradient(#f3dec0, #e8a75b);
        box-shadow: 0 0 18px 2px rgba(232, 167, 91, 0.55), 0 0 60px 8px rgba(232, 167, 91, 0.18);
        animation: splash-light 2s ease-in-out infinite;
      }
      #splash .splash-pool {
        width: 140px;
        height: 18px;
        margin-top: 10px;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgba(232, 167, 91, 0.35), rgba(232, 167, 91, 0));
        animation: splash-light 2s ease-in-out infinite;
      }
      @keyframes splash-light {
        0%,
        100% {
          opacity: 0.45;
          transform: scaleX(1);
        }
        50% {
          opacity: 1;
          transform: scaleX(1.6);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .splash-slit,
        #splash .splash-pool {
          animation: none;
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Cargando">
      <span class="splash-slit"></span>
      <span class="splash-pool"></span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
